<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>
<title>Login — Kipepeo Market</title>
<link
rel="stylesheet"
href="../css/style.css"
>
<script
src="../js/auth.js"
defer
></script>
</head>
<body>
<main>
<section class="auth-section">
<div class="auth-container">
<p class="section-label">
ACCOUNT
</p>
<h1>Welcome Back</h1>
<p>
Log in to your Kipepeo Market account.
</p>
<form id="login-form">
<div class="form-group">
<label for="login-email">
Email Address
</label>
<input
type="email"
id="login-email"
name="email"
required
autocomplete="email"
>
</div>
<div class="form-group">
<label for="login-password">
Password
</label>
<input
type="password"
id="login-password"
name="password"
required
autocomplete="current-password"
>
</div>
<button type="submit">
Log In
</button>
</form>
<div id="login-message"></div>
<p>
Don't have an account?
<a href="register.html">
Create one
</a>
</p>
</div>
</section>
</main>
</body>
</html>
